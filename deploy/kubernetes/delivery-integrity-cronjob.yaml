apiVersion: batch/v1
kind: CronJob
metadata:
  name: presenton-delivery-integrity
spec:
  schedule: "15 2 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      activeDeadlineSeconds: 2100
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: delivery-integrity
              image: ghcr.io/presenton/presenton:latest
              command:
                - /opt/venv/bin/python
                - /app/servers/fastapi/scripts/run_delivery_integrity_scans.py
              env:
                - name: ENTERPRISE_DELIVERY_INTEGRITY_TIMEOUT_SECONDS
                  value: "1800"
                - name: ENTERPRISE_DELIVERY_INTEGRITY_MAX_AGE_HOURS
                  value: "26"
              envFrom:
                - secretRef:
                    name: presenton-runtime
              volumeMounts:
                - name: app-data
                  mountPath: /app_data
          volumes:
            - name: app-data
              persistentVolumeClaim:
                claimName: presenton-app-data
